[package]
name = "prusa-rs"
version = "0.1.0-draft"
authors = ["link@prusa3d.cz", "vivianlazaras@gmail.com"]
description = "This is a printer webservice, and settings management crate"
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
tokio-util = { version = "^0.7", features = ["codec"] }
#reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "stream", "query", "form"] }
thiserror = "2.0.21"
rust-ini = "0.21.3"
walkdir = "2.5.0"
webreq = { path = "../webreq" }
tokio = { version = "1.54.1", features = ["rt", "io-util", "macros"]}

[features]
fs = ["tokio/fs"]
